name: P4 244 legal support gates
on:
  pull_request:
    paths:
      - 'apps/api/app/Support/**'
      - 'apps/api/tests/Feature/Support/**'
      - '.github/workflows/p4-legal-support-244.yml'
      - 'docs/audits/P4-LEGAL-SUPPORT-244-20261114.md'
  workflow_dispatch:
jobs:
  legal-support-php:
    name: Legal support PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, openssl, pdo_sqlite
          coverage: none
          tools: composer:v2
      - name: Enforce secured PHP patch
        run: |
          php -r 'if (!(PHP_VERSION_ID >= 80427 && PHP_VERSION_ID < 80500 || PHP_VERSION_ID >= 80512 && PHP_VERSION_ID < 80600)) {fwrite(STDERR,"Unsafe PHP patch\n"); exit(1);}'
      - name: Install locked dependencies
        working-directory: apps/api
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: PHP syntax
        run: |
          php -l apps/api/app/Support/LegalReleaseGate.php
          php -l apps/api/app/Support/SupportDestinationPolicy.php
          php -l apps/api/tests/Feature/Support/LegalReleaseGateTest.php
          php -l apps/api/tests/Feature/Support/SupportDestinationPolicyTest.php
      - name: Targeted negative gates
        working-directory: apps/api
        run: php vendor/bin/phpunit tests/Feature/Support
      - name: Full PHP regression
        working-directory: apps/api
        run: php vendor/bin/phpunit
      - name: Composer security audit (not suppressed)
        working-directory: apps/api
        run: composer audit --locked
