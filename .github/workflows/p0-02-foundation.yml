name: P0-02 real Laravel + Vue foundation

on:
  # All stacked phase PRs (P2/P3/P4 included) must run real gates.
  pull_request:
  push:
    branches: [main, 'p0/02-**', 'p1/**']

permissions:
  contents: read

jobs:
  laravel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml, openssl, pdo_sqlite, sqlite3, fileinfo, curl, zip
          coverage: none
      - run: php scripts/check-runtime.php
      - name: Composer install from lock
        working-directory: apps/api
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Composer consistency and all PHP syntax
        run: |
          composer validate --no-check-publish --strict --working-dir=apps/api
          find apps/api/app apps/api/bootstrap apps/api/config apps/api/routes apps/api/database apps/api/tests scripts -name '*.php' -type f -print0 | xargs -0 -n1 php -l
      - name: Laravel boot and focused tests
        working-directory: apps/api
        run: |
          php artisan route:list
          php vendor/bin/phpunit

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:web
