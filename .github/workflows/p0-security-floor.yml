name: P0 security floor and contract checks

on:
  pull_request:
  push:
    branches: [main, 'p0/**']

permissions:
  contents: read

jobs:
  php-foundation:
    name: PHP ${{ matrix.php }} security/config
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - name: Enforce patched PHP
        run: php scripts/check-runtime.php
      - name: Validate Laravel dependency constraints
        run: composer validate --no-check-publish --working-dir=apps/api
      - name: Verify canonical five-plan registry
        run: php scripts/verify-plan-config.php
      - name: Lint PHP including config and scripts
        run: |
          find apps/api scripts -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Explicit foundation status
        run: echo 'This job checks P0 contracts. It does not install Laravel or prove route boot, DB, S3, Matrix, security or production readiness.'
