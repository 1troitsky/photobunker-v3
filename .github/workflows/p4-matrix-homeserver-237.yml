name: P4 #237 Matrix BYO homeserver admission

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/app/Matrix/Byo/**'
      - 'apps/api/tests/Feature/MatrixByo/**'
      - '.github/workflows/p4-matrix-homeserver-237.yml'
      - 'docs/audits/P4-MATRIX-HOMESERVER-237-20261114-CHAT-N.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix-byo-admission:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml, openssl, pdo_sqlite, sqlite3, fileinfo, curl, zip
          coverage: none
      - name: Required PHP security floor
        run: php scripts/check-runtime.php
      - name: Locked dependencies and security audit
        working-directory: apps/api
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          composer audit --locked --no-interaction
      - name: Verify new Matrix admission PHP syntax
        run: |
          find apps/api/app/Matrix/Byo apps/api/tests/Feature/MatrixByo -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Matrix BYO feature negative tests
        working-directory: apps/api
        run: php vendor/bin/phpunit tests/Feature/MatrixByo/HomeserverAdmissionTest.php
