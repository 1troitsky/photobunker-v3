name: Issue 211 one-shot safe-preview PHPUnit
on:
  push:
    branches:
      - p2/211-public-card-policy-preflight-20261113
    paths:
      - .github/workflows/issue-211-validate-once.yml
permissions:
  contents: write
jobs:
  phpunit:
    if: github.repository == '1troitsky/photobunker-v3' && github.ref == 'refs/heads/p2/211-public-card-policy-preflight-20261113'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, zip, pdo_pgsql
          tools: composer:v2
          coverage: none
      - name: Security-floor PHP and Composer install
        working-directory: apps/api
        run: |
          php -r 'if (PHP_VERSION_ID < 80512 || PHP_VERSION_ID >= 80600) exit(1);'
          composer validate --strict --no-interaction
          composer audit --locked --no-interaction
          composer install --no-interaction --no-progress --prefer-dist
      - name: New Public Card negative unit tests
        working-directory: apps/api
        run: php vendor/bin/phpunit tests/Unit/PublicCard/SafeCardProjectionTest.php --no-progress
      - name: Remove isolated validation workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/issue-211-validate-once.yml
          git commit -m 'chore(public-card): remove one-shot validation workflow'
          git push origin HEAD:p2/211-public-card-policy-preflight-20261113
