name: Issue 297 one-shot Composer security lock refresh
on:
  push:
    branches:
      - security/297-laravel-13-audit-20261113
    paths:
      - .github/workflows/issue-297-resolve-once.yml
permissions:
  contents: write
jobs:
  resolve:
    if: github.repository == '1troitsky/photobunker-v3' && github.ref == 'refs/heads/security/297-laravel-13-audit-20261113'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          extensions: mbstring, xml, curl, zip, pdo_pgsql
          coverage: none
      - name: Enforce approved PHP security floor
        run: |
          php -r 'if (PHP_VERSION_ID < 80512 || PHP_VERSION_ID >= 80600) { fwrite(STDERR, "PHP 8.5.12+ <8.6 required\n"); exit(1); }'
      - name: Resolve Laravel security update with Composer
        working-directory: apps/api
        run: |
          composer update laravel/framework --with-all-dependencies --minimal-changes --no-interaction --no-progress --no-scripts
          composer validate --strict --no-interaction
          composer audit --locked --no-interaction
          php -r '$d=json_decode(file_get_contents("composer.lock"),true,512,JSON_THROW_ON_ERROR);foreach($d["packages"] as $p){if($p["name"]==="laravel/framework"){echo $p["version"],"\n";if(version_compare(ltrim($p["version"],"v"),"13.40.0","<") || version_compare(ltrim($p["version"],"v"),"14.0.0",">="))exit(1);exit(0);}}exit(1);'
      - name: Commit resolved lockfile and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/issue-297-resolve-once.yml
          git add apps/api/composer.lock
          git diff --cached --check
          git commit -m 'security: resolve patched Laravel 13 and remove temporary resolver'
          git push origin HEAD:security/297-laravel-13-audit-20261113
