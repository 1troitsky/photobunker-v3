name: "P3 #221 Panic signed-intent: patched Laravel PHP acceptance"

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  php-panic-verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml, openssl, pdo_sqlite, sqlite3, fileinfo, curl, zip
          tools: composer:v2
          coverage: none
      - name: Enforce PHP runtime security floor
        run: php scripts/check-runtime.php
      - name: Stage previously verified security #297 Composer lock (CI runner only)
        shell: bash
        run: |
          set -euo pipefail
          # This is the exact, already audited #297/#298 patch; the repository
          # and this pull request still retain their own ORIGINAL composer.lock.
          # No unpinned branch reference, no audit ignore and no upgrade.
          PATCHED_COMMIT=60407676c7cb9bdb649f5017cf9450aff25eedab
          PATCHED_BLOB=c4bcae0458bd390b797186c3e2ccf536469588ef
          PATCHED_URL="https://raw.githubusercontent.com/1troitsky/photobunker-v3/${PATCHED_COMMIT}/apps/api/composer.lock"
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 15 --max-time 90 "$PATCHED_URL" -o /tmp/pb3-panic-patched-composer.lock
          ACTUAL_BLOB="$(git hash-object /tmp/pb3-panic-patched-composer.lock)"
          test "$ACTUAL_BLOB" = "$PATCHED_BLOB" || { echo "Patched lock digest mismatch"; exit 1; }
          cp /tmp/pb3-panic-patched-composer.lock apps/api/composer.lock
          git diff --name-only | grep -qx "apps/api/composer.lock"
          echo "Patched lock staged in disposable runner only: $ACTUAL_BLOB"
      - name: Install PHP dependencies and enforce Composer audit without bypass
        working-directory: apps/api
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          composer validate --no-check-publish --strict
          composer audit --locked --no-interaction
      - name: Lint isolated verify-only Panic PHP source and tests
        run: |
          php -l apps/api/app/Panic/SignedIntentPreflight.php
          php -l apps/api/tests/Feature/Panic/SignedIntentPreflightTest.php
      - name: Run real OpenSSL P1363 / canonical Panic test cases
        working-directory: apps/api
        run: php vendor/bin/phpunit tests/Feature/Panic/SignedIntentPreflightTest.php
      - name: Run full PHP Foundation regression suite against pinned patched lock
        working-directory: apps/api
        run: php vendor/bin/phpunit --testsuite Foundation
      - name: Explicit safe boundary
        run: echo "VERIFY-ONLY acceptance; no live Panic operation, server API, revoke, ACK or cloud deletion tested."
