name: "P3 #221 Panic signed-intent: patched Laravel PHP acceptance"

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  php-panic-verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml, openssl, pdo_sqlite, sqlite3, fileinfo, curl, zip
          tools: composer:v2
          coverage: none
      - name: Enforce PHP runtime security floor
        run: php scripts/check-runtime.php
      - name: Stage previously verified security #297 Composer lock (CI runner only)
        shell: bash
        run: |
          set -euo pipefail
          # This is the exact, already audited #297/#298 patch; the repository
          # and this pull request still retain their own ORIGINAL composer.lock.
          # No unpinned branch reference, no audit ignore and no upgrade.
          PATCHED_COMMIT=60407676c7cb9bdb649f5017cf9450aff25eedab
          PATCHED_BLOB=c4bcae0458bd390b797186c3e2ccf536469588ef
          PATCHED_URL="https://raw.githubusercontent.com/1troitsky/photobunker-v3/${PATCHED_COMMIT}/apps/api/composer.lock"
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 15 --max-time 90 "$PATCHED_URL" -o /tmp/pb3-panic-patched-composer.lock
          ACTUAL_BLOB="$(git hash-object /tmp/pb3-panic-patched-composer.lock)"
          test "$ACTUAL_BLOB" = "$PATCHED_BLOB" || { echo "Patched lock digest mismatch"; exit 1; }
          cp /tmp/pb3-panic-patched-composer.lock apps/api/composer.lock
          git diff --name-only | grep -qx "apps/api/composer.lock"
          echo "Patched lock staged in disposable runner only: $ACTUAL_BLOB"
      - name: Install PHP dependencies and enforce Composer audit without bypass
        working-directory: apps/api
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          composer validate --no-check-publish --strict
          composer audit --locked --no-interaction
      - name: Lint isolated verify-only Panic PHP source and tests
        run: |
          php -l apps/api/app/Panic/SignedIntentPreflight.php
          php -l apps/api/tests/Feature/Panic/SignedIntentPreflightTest.php
      - name: Run real OpenSSL P1363 / canonical Panic test cases
        working-directory: apps/api
        run: php vendor/bin/phpunit tests/Feature/Panic/SignedIntentPreflightTest.php
      - name: Run full PHP Foundation regression suite against pinned patched lock
        working-directory: apps/api
        run: php vendor/bin/phpunit --testsuite Foundation
      - name: Explicit safe boundary
        run: echo "VERIFY-ONLY acceptance; no live Panic operation, server API, revoke, ACK or cloud deletion tested."

  postgres-panic-race:
    name: "Real PostgreSQL 18: P3 #221 two-PHP-process immutable preflight races"
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: pb3_panic_221_ci
          POSTGRES_USER: pb3_panic_ci
          POSTGRES_PASSWORD: pb3_panic_ci_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pb3_panic_ci -d pb3_panic_221_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_URL: https://localhost
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: pb3_panic_221_ci
      DB_USERNAME: pb3_panic_ci
      DB_PASSWORD: pb3_panic_ci_disposable
      CACHE_STORE: array
      SESSION_DRIVER: array
      PB3_PANIC_ISOLATED_PG_QA: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, xml, openssl, pdo_pgsql, pdo_sqlite, fileinfo, curl, zip
          tools: composer:v2
          coverage: none
      - name: Confirm patched PHP and disposable CI-only PostgreSQL context
        shell: bash
        run: |
          set -euo pipefail
          php scripts/check-runtime.php
          test "$GITHUB_ACTIONS" = true
          test "$PB3_PANIC_ISOLATED_PG_QA" = 1
          test "$APP_ENV" = testing
          test "$DB_CONNECTION" = pgsql
          test "$DB_HOST" = 127.0.0.1
          test "$DB_DATABASE" = pb3_panic_221_ci
      - name: Pin audited Laravel security #297 lock in THIS CI runner only
        shell: bash
        run: |
          set -euo pipefail
          PATCHED_COMMIT=60407676c7cb9bdb649f5017cf9450aff25eedab
          PATCHED_BLOB=c4bcae0458bd390b797186c3e2ccf536469588ef
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 15 --max-time 90 \
            "https://raw.githubusercontent.com/1troitsky/photobunker-v3/"$PATCHED_COMMIT"/apps/api/composer.lock" \
            -o /tmp/pb3-panic-pg-221-patched-composer.lock
          test "$(git hash-object /tmp/pb3-panic-pg-221-patched-composer.lock)" = "$PATCHED_BLOB"
          cp /tmp/pb3-panic-pg-221-patched-composer.lock apps/api/composer.lock
          git diff --name-only | grep -qx "apps/api/composer.lock"
      - name: Install securely pinned Laravel and reject Composer vulnerabilities
        working-directory: apps/api
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          composer validate --no-check-publish --strict
          composer audit --locked --no-interaction
      - name: Lint Panic PHP race test and migrate ONLY disposable PostgreSQL
        working-directory: apps/api
        run: |
          php -l tests/integration/panic-preflight-postgres-race.php
          php artisan migrate --force --no-interaction
      - name: Execute three true two-process PG18 lock races and negative replays
        working-directory: apps/api
        run: php tests/integration/panic-preflight-postgres-race.php
      - name: Explicitly refuse false destructive-Panic acceptance
        run: echo "PG18 signed preflight_only rows tested, no Panic HTTP endpoint, revoke, S3/Matrix delete or ACK."
