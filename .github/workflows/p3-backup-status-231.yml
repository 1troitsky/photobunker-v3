name: "P3 #231 authenticated backup limits QA"

# A stacked security-base Draft PR does not trigger existing main-only
# Foundation/PG18 workflows. This workflow adds isolated exact-head checks
# without editing those shared workflows or skipping the composer audit.
on:
  pull_request:
    branches: [main, 'integration/**']
    paths:
      - 'apps/api/app/OperationalLimits/BackupRateStatus.php'
      - 'apps/api/app/Http/Controllers/BackupLimitsStatusController.php'
      - 'apps/api/bootstrap/app.php'
      - 'apps/api/routes/backup.php'
      - 'apps/api/tests/Feature/OperationalLimits/BackupLimitsStatusTest.php'
      - '.github/workflows/p3-backup-status-231.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend TypeScript/build/full Vitest regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - name: Full frontend Vitest (no skip, no retry-as-pass)
        run: pnpm test:web
      - name: Verify no browser secret or backup mutation route is registered
        shell: bash
        run: |
          set -euo pipefail
          # The exact server API is tested with real Identity sessions in PG.
          ! grep -q 'Route::post' apps/api/routes/backup.php

  php:
    name: Full Laravel PHPUnit + Composer audit (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml, openssl, pdo_sqlite, sqlite3, fileinfo, curl, zip
          tools: composer:v2
          coverage: none
      - run: php scripts/check-runtime.php
      - name: Composer install from security-patched lock
        working-directory: apps/api
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Audit lock and verify dependency constraints
        run: |
          composer validate --no-check-publish --strict --working-dir=apps/api
          composer audit --locked --no-interaction --working-dir=apps/api
      - name: Full Laravel PHPUnit
        working-directory: apps/api
        run: php vendor/bin/phpunit

  pg18:
    name: Real PostgreSQL 18 owner-only backup limits (disposable)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: pb3_backup_status_ci
          POSTGRES_USER: pb3_backup_status
          POSTGRES_PASSWORD: pb3_backup_status_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pb3_backup_status -d pb3_backup_status_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_URL: https://localhost
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: pb3_backup_status_ci
      DB_USERNAME: pb3_backup_status
      DB_PASSWORD: pb3_backup_status_disposable
      SESSION_DRIVER: array
      CACHE_STORE: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, xml, openssl, pdo_pgsql, fileinfo, curl, zip
          tools: composer:v2
          coverage: none
      - run: php scripts/check-runtime.php
      - name: Composer audit
        run: composer audit --locked --no-interaction --working-dir=apps/api
      - name: Install locked Laravel dependencies
        working-directory: apps/api
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Migrate disposable PG18 and run real Backup Limits Feature suite
        working-directory: apps/api
        run: |
          php artisan migrate --force
          # phpunit.xml forces SQLite, so use this job's actual PG18 env.
          php vendor/bin/phpunit --no-configuration --bootstrap vendor/autoload.php \
            tests/Feature/OperationalLimits/BackupLimitsStatusTest.php
