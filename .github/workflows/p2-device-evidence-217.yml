name: P2 device evidence metadata tests (#217)

on:
  pull_request:
    paths:
      - 'scripts/device-acceptance/**'
      - '.github/workflows/p2-device-evidence-217.yml'
  push:
    paths:
      - 'scripts/device-acceptance/**'
      - '.github/workflows/p2-device-evidence-217.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-contract-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify metadata fail-closed contract (NOT physical devices)
        run: node --test scripts/device-acceptance/validate.test.mjs
