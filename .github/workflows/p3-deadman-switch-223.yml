name: P3 #223 Dead Man Switch signed state + PG18

on:
  pull_request:
    paths:
      - '.github/workflows/p3-deadman-switch-223.yml'
      - 'apps/api/app/DeadMan/**'
      - 'apps/api/database/migrations/2026_11_14_000001_create_dead_man_switch_v1.php'
      - 'apps/api/tests/Feature/DeadMan/**'
      - 'docs/audits/P3-DEAD-MAN-SWITCH-223-20261114.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  laravel-signed-state:
    name: Laravel PHP ${{ matrix.php }} signed DMS and strict Composer audit
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4','8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml, openssl, pdo_sqlite, sqlite3
          coverage: none
      - name: Enforce supported runtime, Composer lock and no vulnerable Laravel
        run: |
          php scripts/check-runtime.php
          composer validate --no-check-publish --strict --working-dir=apps/api
          composer audit --locked --no-interaction --working-dir=apps/api
      - name: Install patched Laravel from reviewed lock
        working-directory: apps/api
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: New PHP syntax and real signed state machine tests
        run: |
          php -l apps/api/app/DeadMan/DeadManSwitch.php
          php -l apps/api/database/migrations/2026_11_14_000001_create_dead_man_switch_v1.php
          php -l apps/api/tests/Feature/DeadMan/DeadManSwitchTest.php
          cd apps/api
          php vendor/bin/phpunit --filter DeadManSwitchTest

  postgres18:
    name: Real disposable PostgreSQL 18 DMS wall clock and state
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: pb3_dms_ci
          POSTGRES_USER: pb3_dms_ci
          POSTGRES_PASSWORD: pb3_disposable_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pb3_dms_ci -d pb3_dms_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_URL: https://localhost
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: pb3_dms_ci
      DB_USERNAME: pb3_dms_ci
      DB_PASSWORD: pb3_disposable_password
      SESSION_DRIVER: array
      CACHE_STORE: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, xml, openssl, pdo_pgsql
          coverage: none
      - run: php scripts/check-runtime.php
      - name: Composer audit + patched install
        working-directory: apps/api
        run: |
          composer audit --locked --no-interaction
          composer install --no-interaction --no-progress --prefer-dist
      - name: Migrate ephemeral PG18 and test REAL PostgreSQL clock, warning and expiry
        working-directory: apps/api
        run: |
          php artisan migrate --force
          php vendor/bin/phpunit --no-configuration --bootstrap vendor/autoload.php --filter test_pg_server_clock_and_non_destructive_transitions tests/Feature/DeadMan/DeadManSwitchTest.php
