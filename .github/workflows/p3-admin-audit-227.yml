name: "P3 #227 Administration: durable read-only audit ledger QA"

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sqlite-audit:
    name: "Full Foundation + admin ledger / PHP ${{ matrix.php }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml, openssl, pdo_sqlite, sqlite3, fileinfo, curl, zip
          tools: composer:v2
          coverage: none
      - name: Enforce patched runtime and PHP syntax
        run: |
          php scripts/check-runtime.php
          php -l apps/api/app/Administration/AdminAuditLedger.php
          php -l apps/api/database/migrations/2026_11_14_000227_create_admin_audit_records_v1.php
          php -l apps/api/tests/Feature/Administration/AdminAuditLedgerTest.php
      - name: Stage PINNED reviewed #297 Composer lock in disposable runner only
        shell: bash
        run: |
          set -euo pipefail
          PATCHED_COMMIT=60407676c7cb9bdb649f5017cf9450aff25eedab
          PATCHED_BLOB=c4bcae0458bd390b797186c3e2ccf536469588ef
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 15 --max-time 90             "https://raw.githubusercontent.com/1troitsky/photobunker-v3/${PATCHED_COMMIT}/apps/api/composer.lock"             -o /tmp/pb3-admin-227-patched.lock
          test "$(git hash-object /tmp/pb3-admin-227-patched.lock)" = "$PATCHED_BLOB"
          cp /tmp/pb3-admin-227-patched.lock apps/api/composer.lock
          test "$(git diff --name-only)" = "apps/api/composer.lock"
      - name: Install patched dependencies and require zero Composer vulnerabilities
        working-directory: apps/api
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          composer validate --no-check-publish --strict
          composer audit --locked --no-interaction
      - name: Accept new Admin journal tests on SQLite real Laravel database
        working-directory: apps/api
        run: php vendor/bin/phpunit tests/Feature/Administration/AdminAuditLedgerTest.php
      - name: Full PHP Foundation regression suite
        working-directory: apps/api
        run: php vendor/bin/phpunit --testsuite Foundation

  postgres-admin:
    name: "PostgreSQL 18: actual durable Admin audit records"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: pb3_admin_audit_227_ci
          POSTGRES_USER: pb3_admin_ci
          POSTGRES_PASSWORD: pb3_admin_ci_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pb3_admin_ci -d pb3_admin_audit_227_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_URL: https://localhost
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: pb3_admin_audit_227_ci
      DB_USERNAME: pb3_admin_ci
      DB_PASSWORD: pb3_admin_ci_disposable
      CACHE_STORE: array
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, xml, openssl, pdo_pgsql, pdo_sqlite, sqlite3, fileinfo, curl, zip
          tools: composer:v2
          coverage: none
      - name: Refuse all non-disposable / non-PG environments
        shell: bash
        run: |
          set -euo pipefail
          php scripts/check-runtime.php
          test "$GITHUB_ACTIONS" = "true"
          test "$APP_ENV" = "testing"
          test "$DB_CONNECTION" = "pgsql"
          test "$DB_HOST" = "127.0.0.1"
          test "$DB_DATABASE" = "pb3_admin_audit_227_ci"
          test "$DB_USERNAME" = "pb3_admin_ci"
      - name: Stage immutable, audited #297 fixed Laravel lock ONLY in CI runner
        shell: bash
        run: |
          set -euo pipefail
          PATCHED_COMMIT=60407676c7cb9bdb649f5017cf9450aff25eedab
          PATCHED_BLOB=c4bcae0458bd390b797186c3e2ccf536469588ef
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 15 --max-time 90             "https://raw.githubusercontent.com/1troitsky/photobunker-v3/${PATCHED_COMMIT}/apps/api/composer.lock"             -o /tmp/pb3-admin-227-pg-patched.lock
          test "$(git hash-object /tmp/pb3-admin-227-pg-patched.lock)" = "$PATCHED_BLOB"
          cp /tmp/pb3-admin-227-pg-patched.lock apps/api/composer.lock
          test "$(git diff --name-only)" = "apps/api/composer.lock"
      - name: Install locked dependencies and reject Composer advisories
        working-directory: apps/api
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          composer validate --no-check-publish --strict
          composer audit --locked --no-interaction
      - name: Migrate only isolated PostgreSQL 18 CI database
        working-directory: apps/api
        run: php artisan migrate --force --no-interaction
      - name: Verify real PG18 admin audit INSERT / chain / replay / reject
        working-directory: apps/api
        run: |
          php vendor/bin/phpunit --no-configuration --bootstrap vendor/autoload.php             tests/Feature/Administration/AdminAuditLedgerTest.php
      - name: Explicitly forbid privilege-activation claims
        run: |
          echo "Durable, inert audit records only; NOT an admin session, MFA admission, grant, ban, revoke, user data read or tamper-evident external anchor."
