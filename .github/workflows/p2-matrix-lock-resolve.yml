name: P2 SDK lockfile resolve (temporary branch-only)
on:
  push:
    branches: [p2/02b-rust-matrix-client]
    paths:
      - 'apps/web/package.json'
      - '.github/workflows/p2-matrix-lock-resolve.yml'
permissions:
  contents: write
jobs:
  lock:
    if: github.repository == '1troitsky/photobunker-v3'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p2/02b-rust-matrix-client
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve exact pinned package lock (branch only)
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --no-frozen-lockfile
          grep -A3 -E "^      matrix-js-sdk:" pnpm-lock.yaml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "build(matrix): resolve pnpm lockfile for pinned SDK"
            git push origin HEAD:p2/02b-rust-matrix-client
          fi
