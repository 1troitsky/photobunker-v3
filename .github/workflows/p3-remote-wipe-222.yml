name: "P3 #222 Remote Wipe isolated signed-ledger QA (NOT remote wipe acceptance)"

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/api/app/RemoteWipe/**"
      - "apps/api/database/migrations/2026_11_14_000222_create_remote_wipe_commands_v1.php"
      - "apps/api/tests/Feature/RemoteWipe/**"
      - "apps/api/tests/integration/p3-remote-wipe-postgres-race.php"
      - ".github/workflows/p3-remote-wipe-222.yml"

permissions:
  contents: read

jobs:
  php-signed-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php }}"
          extensions: mbstring, dom, xml, openssl, pdo_sqlite, sqlite3, fileinfo, curl, zip
          tools: composer:v2
          coverage: none
      - name: Reject PHP below patched runtime security floor
        run: php scripts/check-runtime.php
      - name: Pin verified #297 Composer security lock in disposable CI only
        shell: bash
        run: |
          set -euo pipefail
          PATCHED_COMMIT=60407676c7cb9bdb649f5017cf9450aff25eedab
          PATCHED_BLOB=c4bcae0458bd390b797186c3e2ccf536469588ef
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 15 --max-time 90 \
            "https://raw.githubusercontent.com/1troitsky/photobunker-v3/$PATCHED_COMMIT/apps/api/composer.lock" \
            -o /tmp/pb3-222-patched-composer.lock
          test "$(git hash-object /tmp/pb3-222-patched-composer.lock)" = "$PATCHED_BLOB"
          cp /tmp/pb3-222-patched-composer.lock apps/api/composer.lock
          git diff --name-only | grep -qx "apps/api/composer.lock"
      - name: Install and enforce actual Composer audit
        working-directory: apps/api
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          composer validate --no-check-publish --strict
          composer audit --locked --no-interaction
      - name: Lint PHP 8.4+ and run signed/replay security regression
        working-directory: apps/api
        run: |
          php -l app/RemoteWipe/SignedDeferredCommand.php
          php -l database/migrations/2026_11_14_000222_create_remote_wipe_commands_v1.php
          php -l tests/Feature/RemoteWipe/SignedDeferredCommandTest.php
          php vendor/bin/phpunit tests/Feature/RemoteWipe/SignedDeferredCommandTest.php
      - name: Full existing PHP Foundation regression (audited dependencies)
        working-directory: apps/api
        run: php vendor/bin/phpunit --testsuite Foundation
      - name: No destructive-wipe claim
        run: echo "Only signed already-revoked-device deferred ledger tested; no revoke, S3, Matrix, browser wipe or device ACK proof."

  postgres-18-signed-ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: pb3_remote_222_ci
          POSTGRES_USER: pb3_remote_ci
          POSTGRES_PASSWORD: pb3_remote_ci_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pb3_remote_ci -d pb3_remote_222_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_URL: https://localhost
      DB_CONNECTION: pgsql
      DB_DATABASE: pb3_remote_222_ci
      PB3_REMOTE_WIPE_PG_RACE: "1"
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USERNAME: pb3_remote_ci
      DB_PASSWORD: pb3_remote_ci_disposable
      SESSION_DRIVER: array
      CACHE_STORE: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, dom, xml, openssl, pdo_pgsql, pdo_sqlite, sqlite3, fileinfo, curl, zip
          tools: composer:v2
          coverage: none
      - name: Enforce patched runtime and disposable database only
        run: |
          php scripts/check-runtime.php
          test "$GITHUB_ACTIONS" = true
          test "$DB_HOST" = 127.0.0.1
          test "$DB_USERNAME" = pb3_remote_ci
          test "$DB_CONNECTION" = pgsql
          test "$DB_DATABASE" = pb3_remote_222_ci
          test "$PB3_REMOTE_WIPE_PG_RACE" = 1
      - name: Pin verified #297 Composer lock in disposable CI only
        shell: bash
        run: |
          set -euo pipefail
          PATCHED_COMMIT=60407676c7cb9bdb649f5017cf9450aff25eedab
          PATCHED_BLOB=c4bcae0458bd390b797186c3e2ccf536469588ef
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 15 --max-time 90 \
            "https://raw.githubusercontent.com/1troitsky/photobunker-v3/$PATCHED_COMMIT/apps/api/composer.lock" \
            -o /tmp/pb3-222-pg-patched-composer.lock
          test "$(git hash-object /tmp/pb3-222-pg-patched-composer.lock)" = "$PATCHED_BLOB"
          cp /tmp/pb3-222-pg-patched-composer.lock apps/api/composer.lock
          git diff --name-only | grep -qx "apps/api/composer.lock"
      - name: Composer security gate
        working-directory: apps/api
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          composer validate --no-check-publish --strict
          composer audit --locked --no-interaction
      - name: Create CI-only PostgreSQL PHPUnit config; do NOT claim SQLite as PG
        working-directory: apps/api
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("phpunit.xml").read_text()
          assert 'name="DB_CONNECTION" value="sqlite" force="true"' in p
          assert 'name="DB_DATABASE" value=":memory:" force="true"' in p
          p = p.replace('name="DB_CONNECTION" value="sqlite" force="true"', 'name="DB_CONNECTION" value="pgsql" force="true"')
          p = p.replace('name="DB_DATABASE" value=":memory:" force="true"', 'name="DB_DATABASE" value="pb3_remote_222_ci" force="true"')
          Path("phpunit.pg-222.xml").write_text(p)
          PY
          grep -q 'DB_CONNECTION" value="pgsql"' phpunit.pg-222.xml
          grep -q 'DB_DATABASE" value="pb3_remote_222_ci"' phpunit.pg-222.xml
      - name: Genuine PostgreSQL 18 migrations and signed ledger tests
        working-directory: apps/api
        run: |
          DB_CONNECTION=pgsql DB_DATABASE=pb3_remote_222_ci php artisan migrate --force --no-interaction
          php vendor/bin/phpunit --configuration phpunit.pg-222.xml tests/Feature/RemoteWipe/SignedDeferredCommandTest.php
      - name: Prove 3 real two-independent-PHP-process PostgreSQL18 lock races
        working-directory: apps/api
        shell: bash
        run: |
          set -euo pipefail
          php -l tests/integration/p3-remote-wipe-postgres-race.php
          php tests/integration/p3-remote-wipe-postgres-race.php 2>&1 | tee /tmp/pb3-remote-222-race-proof.log
          # Laravel may swallow an uncaught CLI exception after logging it.
          # Exit code alone was a FALSE PASS in prior #43544178410; require
          # a precise final sentinel emitted only after all three races.
          grep -Fqx '#222 PG18 COMPLETE: 3/3 proven two-process races, 3 pending commands, no live wipe' /tmp/pb3-remote-222-race-proof.log
      - name: Explicit scope
        run: echo "Real disposable PostgreSQL18 single-process features and independently observed two-PHP-process lock races only; NO physical wipe."
