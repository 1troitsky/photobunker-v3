# QA-only: validate #198 code with the independently reviewed #297 security
# lock inside a DISPOSABLE CI runner. The PR's composer.lock is not changed.
# This is NOT the exact unpatched-branch dependency acceptance gate.
name: P2 198 PHP with pinned patched Laravel lock (composite QA)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/p2-198-pinned-security-lock-qa.yml'
      - 'apps/api/app/Http/Controllers/IdentityController.php'
      - 'apps/api/app/Events/**'
      - 'apps/api/tests/Feature/Events/**'

permissions:
  contents: read

jobs:
  notifications-php:
    if: github.event.pull_request.number == 296
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
        with:
          # Test actual PR HEAD, not the ephemeral GitHub merge ref.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: true
      - name: Verify pinned security lock and stage it ONLY in runner
        shell: bash
        run: |
          set -euo pipefail
          # Independent agent #297's reviewed and fully audited Laravel 13.42.0 lock.
          # Stop if its branch changes: do not silently validate a new dependency set.
          git fetch --no-tags --depth=1 origin refs/heads/security/297-laravel-13-audit-20261113
          test "$(git rev-parse FETCH_HEAD)" = "60407676c7cb9bdb649f5017cf9450aff25eedab"
          git show FETCH_HEAD:apps/api/composer.lock > apps/api/composer.lock
          test "$(git hash-object apps/api/composer.lock)" = "c4bcae0458bd390b797186c3e2ccf536469588ef"
          echo "QA combination: #198 PR head + #297 exact audited lock (runner only)"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml, openssl, pdo_sqlite, sqlite3, fileinfo, curl, zip
          tools: composer:v2
          coverage: none
      - name: Enforce PHP runtime security floor
        run: php scripts/check-runtime.php
      - name: Check Composer lock consistency AND audit (no suppression)
        run: |
          composer validate --no-check-publish --strict --working-dir=apps/api
          composer audit --locked --no-interaction --working-dir=apps/api
      - name: Install from pinned audited lock
        working-directory: apps/api
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Verify PHP syntax on owned code
        run: |
          php -l apps/api/app/Http/Controllers/IdentityController.php
          php -l apps/api/app/Events/PushDeviceSubscriptionRegistry.php
          php -l apps/api/tests/Feature/Events/DeviceRevokedNotificationTest.php
          php -l apps/api/tests/Feature/Events/PushDeviceSubscriptionRegistryTest.php
      - name: Run full Laravel PHPUnit suite
        working-directory: apps/api
        run: |
          php artisan route:list
          php vendor/bin/phpunit
