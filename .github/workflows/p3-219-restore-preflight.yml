name: P3 #219 Recovery Vault signed manifest preflight

on:
  pull_request:
    paths:
      - '.github/workflows/p3-219-restore-preflight.yml'
      - 'apps/api/app/Recovery/RestoreManifestPreflight.php'
      - 'apps/api/tests/Feature/Recovery/RestoreManifestPreflightTest.php'
      - 'scripts/p3-219-restore-preflight-bootstrap.php'
      - 'docs/audits/P3-RECOVERY-VAULT-219-PREFLIGHT-20261114.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-restore-readonly:
    name: Offline P-256 verify and no-resurrection / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4','8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: phpunit:12
      - name: Verify PHP security floor and lint own files
        run: |
          php -l apps/api/app/Recovery/RestoreManifestPreflight.php
          php -l apps/api/tests/Feature/Recovery/RestoreManifestPreflightTest.php
          php -l scripts/p3-219-restore-preflight-bootstrap.php
      - name: Run real detached P-256 signed recovery-manifest and retention negatives
        run: phpunit --no-configuration --colors=never --bootstrap scripts/p3-219-restore-preflight-bootstrap.php apps/api/tests/Feature/Recovery
