function renderData(){return `<div class="page-wrap">${sectionTitle('Данные и хранилище','Файлы, резервные копии и управление данными')}
<div class="settings-stack">
${group('Хранилище',`<div class="panel-pad"><div class="stat-top"><div><div class="stat-title">Зашифрованное облако</div><div class="subtle">Тариф Unlimited · доступно до 1 ТБ</div></div><div class="stat-amount">${store.cloudGb.toFixed(1)} <small>ГБ</small></div></div><div class="bar"><span style="width:${Math.max(2,store.cloudGb/1024*100)}%"></span></div><div class="metric-list">${metric('Файлы','1 284 · без ограничения количества')}${metric('На устройстве',store.localMb+' МБ')}${metric('Ожидают синхронизации',store.queue+' файла')}</div><div class="actions-inline"><button type="button" class="action" data-action="navigate-browser">${icon('folder')} Открыть файлы</button></div></div>`, 'setting-storage',true)}
${group('Резервная копия',`<div class="panel-pad"><div class="row-between"><div><div class="block-title">Одна актуальная копия</div><p class="block-caption"><span class="status-spot"></span>${store.backupStatus} · ${store.lastBackup}</p></div><span class="mini-badge">Шифрование</span></div><div class="metric-list">${metric('Автоматическое обновление',store.draft.autoBackup?'Каждый день':'Выключено')}${metric('Ручное обновление','Без ограничений')}</div><div class="actions-inline"><button class="action" data-action="go-backup" type="button">${icon('refresh')} Управлять копией</button><button class="action" data-action="go-vault" type="button">Recovery Vault ${icon('chevron')}</button></div></div>`, 'setting-backup',true)}
${group('Кэш на устройстве',`<div class="panel-pad"><div class="stat-top"><div><div class="block-title">Зашифрованный кэш</div><p class="block-caption">Миниатюры и временные данные для быстрого просмотра</p></div><b>${store.cacheMb} МБ</b></div><div class="actions-inline"><button type="button" class="action" data-action="clear-cache">${icon('trash')} Очистить кэш</button></div><p class="tiny-message">Очистка не затрагивает файлы, ожидающие отправки, и данные заданий.</p><div style="margin-top:14px"><label class="field-label" for="cache-mode">Размер кэша</label><select id="cache-mode" class="form-select" data-pref="cacheMode"><option value="auto" ${store.draft.cacheMode==='auto'?'selected':''}>Автоматически</option><option value="small" ${store.draft.cacheMode==='small'?'selected':''}>Минимальный</option><option value="medium" ${store.draft.cacheMode==='medium'?'selected':''}>До 500 МБ</option></select></div></div>`, 'setting-cache')}
${group('Хранение файлов',`<div class="list-row"><span class="ico">${icon('clock')}</span><span class="copy"><strong>Автоматически продлевать срок хранения</strong><small>До окончания действия тарифного плана, если это разрешено правилами задания</small></span><label class="switch" aria-label="Автоматически продлевать срок хранения"><input id="auto-renew" type="checkbox" data-pref="autoRenew" ${store.draft.autoRenew?'checked':''}><span class="track"></span></label></div><div class="panel-pad panel-inner"><p class="small-muted" style="margin:0">Продление не отменяет срок удаления, установленный владельцем задания, и не восстанавливает уже удалённые файлы.</p></div>`, 'setting-auto-renew')}
${group('Перенос и удаление',`${row('transfer','Перенести данные','Экспорт файлов, заданий и настроек','go-transfer')}${row('trash','Удалить данные','Данные устройства и облака — раздельные действия','go-remove')}`,'setting-transfer',true)}
</div></div>`}
function renderSettings(){const options=[['user','Профиль и люди','Карточка, контакты и команды','profile'],['settings','Оформление','Тема, цвет, язык','appearance'],['bell','Уведомления','Настройки уведомлений','notifications'],['shield','Безопасность и конфиденциальность','PIN, устройства, Recovery Key','security'],['database','Данные и хранилище','Облако, бэкап, кэш и удаление','data'],['help','Помощь','FAQ и информация','help']];return `<div class="page-wrap">${sectionTitle('Настройки','Параметры PhotoBunker',false)}<div class="settings-stack">${group('Разделы',options.map(([k,title,sub,route])=>row(k,title,sub,route==='data'?'go-data':'open-other-'+route)).join(''),'settings-categories',true)}</div></div>`}
function renderBackup(){return `<div class="page-wrap">${sectionTitle('Резервная копия','Одна актуальная зашифрованная копия аккаунта')}
<div class="settings-stack">
${group('Состояние',`<div class="panel-pad"><div class="row-between"><span class="block-title">${store.backupStatus}</span><span class="mini-badge">Unlimited</span></div><div class="metric-list">${metric('Последнее обновление',store.lastBackup)}${metric('Доступных точек восстановления','1')}${metric('Проверка целостности',store.backupStatus)}</div><div class="actions-inline"><button type="button" class="action primary" data-action="backup-now">${icon('refresh')} Обновить сейчас</button></div><p class="tiny-message">Новое обновление заменяет предыдущую актуальную копию после проверки.</p></div>`,'backup-state',true)}
${group('Автоматическое обновление',`<div class="list-row"><span class="ico">${icon('refresh')}</span><span class="copy"><strong>Обновлять каждый день</strong><small>Использовать доступную частоту тарифа Unlimited</small></span><label class="switch" aria-label="Автоматические резервные копии"><input type="checkbox" data-pref="autoBackup" ${store.draft.autoBackup?'checked':''}><span class="track"></span></label></div><div class="panel-pad panel-inner"><p class="small-muted" style="margin:0">Копия защищена шифрованием. Для восстановления понадобится Recovery Key.</p></div>`,'setting-auto-backup',true)}
${group('Восстановление',`${row('shield','Recovery Vault','Проверка копии и восстановление доступа','go-vault')}`,'setting-vault-link',true)}
</div></div>`}
function renderVault(){return `<div class="page-wrap">${sectionTitle('Recovery Vault','Восстановление из зашифрованной резервной копии')}
<div class="settings-stack">
${group('Состояние Vault',`<div class="panel-pad"><div class="row-between"><span class="block-title"><span class="status-spot"></span>Копия доступна</span><span class="mini-badge">1 копия</span></div><div class="metric-list">${metric('Последнее обновление',store.lastBackup)}${metric('Проверка',store.backupStatus)}${metric('Для восстановления','Recovery Key')}</div><div class="actions-inline"><button type="button" class="action" data-action="check-vault">${icon('shield')} Проверить копию</button><button type="button" class="action primary" data-action="restore-vault">Восстановить данные</button></div></div>`,'vault-status',true)}
${group('Что сохраняется',`<div class="panel-pad"><p class="small-muted" style="margin:0">Зашифрованные материалы и доступные метаданные аккаунта на момент последнего обновления. Файлы с истёкшим сроком хранения восстановлению не подлежат.</p></div>`,'vault-contents',true)}
${group('Recovery Key',`${row('key','Управление ключом','Показать или сменить ключ — в разделе безопасности','open-security')}`,'vault-key',true)}
</div></div>`}
function renderTransfer(){return `<div class="page-wrap">${sectionTitle('Перенос данных','Перенос аккаунта и экспорт материалов')}
<div class="settings-stack">
${group('Перенос на другое устройство',`<div class="panel-pad"><div class="block-title">Перенести аккаунт</div><p class="block-caption">На новом устройстве используйте Recovery Key или подтвердите подключение с доверенного устройства.</p><div class="actions-inline"><button type="button" class="action" data-action="open-security">${icon('key')} Recovery Key</button></div></div>`,'transfer-device',true)}
${group('Экспорт данных',`<div class="panel-pad" id="transfer-exports"><div class="block-title">Какие данные включить?</div><p class="block-caption">Экспортируются только те файлы и сведения, к которым у вас есть доступ.</p><label class="choice-row"><input type="checkbox" data-export="files" ${store.exportChoices.files?'checked':''}><span>Мои файлы и их описания</span></label><label class="choice-row"><input type="checkbox" data-export="assignments" ${store.exportChoices.assignments?'checked':''}><span>Задания и связанные сведения</span></label><label class="choice-row"><input type="checkbox" data-export="settings" ${store.exportChoices.settings?'checked':''}><span>Настройки приложения</span></label><div class="actions-inline"><button class="action primary" type="button" data-action="prepare-export">${icon('download')} Подготовить экспорт</button></div><p class="tiny-message">Секрет Recovery Key никогда не включается в экспорт автоматически.</p></div>`,'setting-transfer',true)}
</div></div>`}
function renderRemove(){return `<div class="page-wrap">${sectionTitle('Удаление данных','Управление локальными и облачными материалами')}
<div class="settings-stack">
${group('На устройстве',`<div class="panel-pad"><div class="block-title">Удалить данные с этого устройства</div><p class="block-caption">Локальные файлы, ключи доступа и очереди синхронизации будут недоступны. Несинхронизированные материалы могут быть потеряны.</p><div class="actions-inline"><button type="button" class="action danger" data-action="remove-device">Удалить данные с устройства</button></div></div>`,'remove-local',true)}
${group('В облаке',`<div class="panel-pad"><div class="block-title">Удалить облачные материалы</div><p class="block-caption">Файлы и связанные сведения удаляются с сервера после подтверждения. Это отдельная операция, не равная очистке локального кэша.</p><div class="actions-inline"><button type="button" class="action danger" data-action="remove-cloud">Удалить данные из облака</button></div></div>`,'remove-cloud',true)}
${group('Очистка кэша',`${row('trash','Очистить кэш','Сохранённые файлы и очередь отправки не затрагиваются','clear-cache')}`,'remove-cache',true)}
</div></div>`}
const SEARCH=[['Объём облака','storage','data','cloud storage облако объем quota лимит гигабайты'],['Резервная копия','backup','data','backup бэкап резервная копия'],['Recovery Vault','vault','vault','recovery восстановление vault'],['Кэш','cache','data','cache кэш очистка'],['Автопродление файлов','auto-renew','data','renew продлить автоматически срок хранения файлов'],['Автобэкап','auto-backup','backup','automatic backup daily автообновление'],['Перенос данных','transfer','transfer','transfer export перенос экспорт'],['Удаление данных','remove','remove','delete удалить очистка'],['Recovery Key','key','vault','key ключ восстановления']];
function renderSearch(){const q=store.query.trim().toLowerCase();const terms=SEARCH.filter(([label,key,route,words])=>!q||`${label} ${words}`.toLowerCase().includes(q));return `<div class="page-wrap">${sectionTitle('Поиск по настройкам','Найти конкретный параметр',false)}<div class="search-results">${terms.length?terms.map(([label,key,route])=>`<button type="button" class="search-row" data-target="${key}" data-route="${route}">${icon('search')}<span class="copy"><strong>${label}</strong><small>${route==='data'?'Данные и хранилище':route==='backup'?'Резервная копия':route==='vault'?'Recovery Vault':route==='transfer'?'Перенос данных':'Удаление данных'}</small></span>${icon('chevron')}</button>`).join(''):'<div class="panel-pad small-muted">Ничего не найдено</div>'}</div></div>`}
function closeSheet(){store.sheet=null;$('#overlay').hidden=true;$('#sheet-content').innerHTML=''}
function openSheet(title,markup){store.sheet=title;$('#sheet-title').textContent=title;$('#sheet-content').innerHTML=markup;$('#sheet-close').innerHTML=icon('close');$('#overlay').hidden=false;const focusable=$('#sheet-content button');if(focusable)focusable.focus({preventScroll:true})}
function showConfirm(title,message,button,action){openSheet(title,`<p class="intro">${message}</p><div class="choice-actions"><button type="button" class="action" data-action="close-sheet">Отмена</button><button type="button" class="action danger" data-action="${action}">${button}</button></div>`)}
function showExport(){const chosen=Object.entries(store.exportChoices).filter(([,v])=>v).map(([k])=>({files:'Мои файлы и описания',assignments:'Задания',settings:'Настройки приложения'}[k]));if(!chosen.length){toast('Выберите данные для экспорта');return}openSheet('Экспорт данных',`<p class="intro">Выбрано для переноса:</p><p>${chosen.map(esc).join('<br>')}</p><p>Для скачивания материалов приложение запросит подтверждение доступа и проверит права на каждый файл.</p><div class="choice-actions"><button class="action" data-action="close-sheet">Закрыть</button><button class="action primary" data-action="download-export-spec">${icon('download')} Сохранить список</button></div>`)}
async function saveSelection(){const lines=['PhotoBunker · Список для переноса',...Object.entries(store.exportChoices).filter(([,v])=>v).map(([k])=>({files:'Мои файлы и описания',assignments:'Задания',settings:'Настройки приложения'}[k]))];const content=lines.join('\n')+'\n';try{if(typeof window.showSaveFilePicker==='function'){const h=await window.showSaveFilePicker({suggestedName:'photobunker-export-selection.txt',types:[{description:'Текст',accept:{'text/plain':['.txt']}}]});const w=await h.createWritable();await w.write(content);await w.close();closeSheet();toast('Список сохранён');return}if(navigator.share&&navigator.canShare&&navigator.canShare({files:[new File([content],'photobunker-export-selection.txt',{type:'text/plain'})]})){await navigator.share({files:[new File([content],'photobunker-export-selection.txt',{type:'text/plain'})],title:'PhotoBunker'});closeSheet();return}openSheet('Сохранение',`<p>На этом устройстве недоступен выбор места сохранения через браузер. Скопируйте список для переноса.</p><pre style="white-space:pre-wrap;font-size:11px">${esc(content)}</pre><button class="action" data-action="copy-export">${icon('download')} Скопировать список</button>`)}catch(e){if(e?.name!=='AbortError')toast('Не удалось сохранить список')}}
function navigate(route,target=null){if(!['data','settings','backup','vault','transfer','remove'].includes(route)){openSheet('Раздел PhotoBunker','<p>Этот раздел открывается из общего меню приложения.</p><button class="action" data-action="close-sheet">Закрыть</button>');return}store.scrollPositions[store.route]=$('#main').scrollTop;store.depth+=1;history.pushState({route,depth:store.depth},'',`#${route}`);store.route=route;store.searchOpen=false;store.query='';$('#search-tray').hidden=true;render();if(target)jumpTo(target)}
function jumpTo(id){const target=$('#setting-'+id)||$('#'+id);if(!target)return;const scroller=$('#main');const delta=target.getBoundingClientRect().top-scroller.getBoundingClientRect().top+scroller.scrollTop-12;scroller.scrollTop=Math.max(0,delta);target.classList.add('targeted');if(!target.hasAttribute('tabindex'))target.setAttribute('tabindex','-1');target.focus({preventScroll:true});setTimeout(()=>target.classList.remove('targeted'),1800)}
function render(keepScroll=false){const main=$('#main'),scroll=main.scrollTop;$('#content').innerHTML=store.searchOpen?renderSearch():({data:renderData,settings:renderSettings,backup:renderBackup,vault:renderVault,transfer:renderTransfer,remove:renderRemove}[store.route]||renderData)();main.scrollTop=keepScroll?scroll:0;const save=$('#appearance-actions');save.hidden=!['data','backup'].includes(store.route)||store.searchOpen;$('#save-settings').disabled=!isDirty();$('#header-search').innerHTML=icon('search');$('#header-bell').innerHTML=icon('bell')+'<span class="bell-count">2</span>';renderDock()}
function renderDock(){const list=[['tasks','Задания'],['folder','Browser'],['camera','Камера'],['users','Контакты'],['user','Профиль']];$('#dock').innerHTML=list.map(([k,label])=>`<button type="button" data-action="dock" title="${label}" class="${k==='user'?'active':''}">${icon(k)}<small>${label}</small></button>`).join('')}
function searchToggle(open){store.searchOpen=open;store.query='';$('#search-tray').hidden=!open;$('#settings-query').value='';$('#search-icon').innerHTML=icon('search');$('#clear-search').innerHTML=icon('close');$('#clear-search').hidden=true;render();if(open)$('#settings-query').focus()}
function goBack(){if(store.searchOpen){searchToggle(false);return}if(store.sheet){closeSheet();return}if(store.depth>0&&history.state?.depth>0){history.back()}else if(store.route!=='settings')navigate('settings')}
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.pref){store.draft[el.dataset.pref]=el.type==='checkbox'?el.checked:el.value;render(true)}if(el.dataset.export){store.exportChoices[el.dataset.export]=el.checked}});
document.addEventListener('input',e=>{if(e.target.id==='settings-query'){store.query=e.target.value;$('#clear-search').hidden=!store.query;render(true)}});
document.addEventListener('click',e=>{const device=e.target.closest('[data-device]');if(device){$('#device').className='device '+device.dataset.device;document.querySelectorAll('[data-device]').forEach(b=>{b.classList.toggle('selected',b===device);b.setAttribute('aria-pressed',String(b===device))});return}const res=e.target.closest('[data-target]');if(res){const route=res.dataset.route,target=res.dataset.target;searchToggle(false);navigate(route,target);return}const control=e.target.closest('[data-action]');if(!control)return;const action=control.dataset.action;e.preventDefault();switch(action){case 'search':searchToggle(!store.searchOpen);break;case 'close-search':searchToggle(false);break;case 'clear-search':store.query='';$('#settings-query').value='';$('#clear-search').hidden=true;render(true);$('#settings-query').focus();break;case 'back':goBack();break;case 'go-data':navigate('data');break;case 'go-backup':navigate('backup');break;case 'go-vault':navigate('vault');break;case 'go-transfer':navigate('transfer');break;case 'go-remove':navigate('remove');break;case 'navigate-browser':case 'open-security':case 'open-other-security':case 'open-other-appearance':case 'open-other-notifications':case 'open-other-help':case 'open-other-profile':case 'bell':case 'dock':case 'tariff':case 'status':navigate('other');break;case 'save':store.saved={...store.draft};render(true);toast('Настройки сохранены');break;case 'cancel':store.draft={...store.saved};render(true);toast('Изменения отменены');break;case 'close-sheet':closeSheet();break;case 'clear-cache':showConfirm('Очистить кэш?','Будут удалены только временные зашифрованные файлы и миниатюры. Очередь отправки и оригиналы останутся.','Очистить кэш','confirm-clear-cache');break;case 'confirm-clear-cache':store.localMb=Math.max(0,store.localMb-store.cacheMb);store.cacheMb=0;closeSheet();render(true);toast('Кэш очищен');break;case 'backup-now':store.backupStatus='Проверена';store.lastBackup='Только что';render(true);toast('Копия обновлена');break;case 'check-vault':store.backupStatus='Проверена';render(true);toast('Проверка завершена');break;case 'restore-vault':openSheet('Восстановление данных',`<p class="intro">Для восстановления потребуется Recovery Key.</p><p>Восстановить можно только доступные материалы, срок хранения которых ещё не истёк.</p><p>Перед началом необходимо проверить текущие файлы устройства и выбрать способ объединения данных.</p><div class="choice-actions"><button class="action" data-action="close-sheet">Отмена</button><button class="action primary" data-action="review-restore">Продолжить</button></div>`);break;case 'review-restore':openSheet('Способ восстановления',`<p>Выберите, как поступить с текущими локальными материалами.</p><label class="field-label" for="restore-method">Способ</label><select class="form-select" id="restore-method"><option value="merge">Объединить с текущими</option><option value="separate">Восстановить отдельно</option></select><div class="choice-actions"><button class="action" data-action="close-sheet">Отмена</button><button class="action primary" data-action="finish-restore">Далее</button></div>`);break;case 'finish-restore':closeSheet();toast('Выбран способ восстановления');break;case 'prepare-export':showExport();break;case 'download-export-spec':void saveSelection();break;case 'copy-export':{const text='PhotoBunker · Выбранные данные для переноса\n'+Object.keys(store.exportChoices).filter(k=>store.exportChoices[k]).join(', ');void navigator.clipboard?.writeText(text).then(()=>toast('Список скопирован')).catch(()=>toast('Не удалось скопировать'));closeSheet();break}case 'remove-device':showConfirm('Удаление данных с устройства','Будут удалены локальные материалы и ключи доступа. Неотправленные в облако файлы могут быть потеряны.','Удалить с устройства','confirm-remove-device');break;case 'confirm-remove-device':closeSheet();toast('Удаление требует подтверждения на устройстве');break;case 'remove-cloud':showConfirm('Удаление облачных данных','После подтверждения сервер должен удалить доступные облачные материалы. Эта операция не заменяет экстренный PIN и не отменяет правила резервных копий.','Удалить из облака','confirm-remove-cloud');break;case 'confirm-remove-cloud':closeSheet();toast('Требуется подтверждение сервера');break;}});
$('#overlay').addEventListener('click',e=>{if(e.target===$('#overlay'))closeSheet()});
window.addEventListener('keydown',e=>{if(e.key==='Escape'){if(store.sheet)closeSheet();else if(store.searchOpen)searchToggle(false)}});
window.addEventListener('popstate',e=>{store.route=['data','settings','backup','vault','transfer','remove'].includes(e.state?.route)?e.state.route:'data';store.depth=e.state?.depth||0;store.searchOpen=false;$('#search-tray').hidden=true;render();$('#main').scrollTop=store.scrollPositions[store.route]||0});
const hash=decodeURIComponent(location.hash.slice(1));store.route=['data','settings','backup','vault','transfer','remove'].includes(hash)?hash:'data';history.replaceState({route:store.route,depth:0},'',`#${store.route}`);$('#search-icon').innerHTML=icon('search');$('#clear-search').innerHTML=icon('close');render();
})();

</script></body></html>
