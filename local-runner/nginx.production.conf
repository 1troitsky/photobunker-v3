server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 140m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Preserve same-origin Laravel sessions, CSRF and signed API contracts.
    location ~ ^/(?:api/|notifications/v1(?:/|$)|public-cards/v1(?:/|$)|identity/v2(?:/|$)|billing/v1(?:/|$)|backup/v1(?:/|$)|photos/v1(?:/|$)|media/v1(?:/|$)|media-shares/v1(?:/|$)|media-file-preview/v1(?:/|$)|shares/v1(?:/|$)|assignments/v1(?:/|$)|teams/v[12](?:/|$)|folders/v1(?:/|$)|browser/v1(?:/|$)) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # No source modules or unsigned Service Worker delivery in this runner.
    location ~ ^/(?:src/|@vite/|sw\.js$|workbox-[^/]+\.js$) {
        return 404;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
}
